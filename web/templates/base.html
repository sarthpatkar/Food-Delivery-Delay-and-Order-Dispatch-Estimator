<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Delivery Delay Estimator{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    {% block head %}{% endblock %}
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <a href="/" class="brand">Delivery Delay Estimator</a>
            <nav class="nav-links">
                <a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Predict</a>
                <a href="/retrain" class="nav-link {% if request.path == '/retrain' %}active{% endif %}">Retrain</a>
                <a href="/explain" class="nav-link {% if request.path == '/explain' %}active{% endif %}">Models</a>
            </nav>
        </div>
    </header>

    <main class="main-content">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        AI/ML lab mini project &middot; Kaggle food delivery dataset, 45,584 orders
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
